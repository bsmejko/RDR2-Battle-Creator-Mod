[Info]
; Battle Creator settings for the RDR2 ScriptHook mod.
; Values are clamped by the script if they are outside the safe ranges.
; Changes made in the in-game Settings page are written here when Save settings is pressed.
; Restart the script/game, or use the in-game Reload INI option, after manually editing.
; Custom selectable ped groups live in BattleCreatorCustomPeds.ini.

[Keys]
; Menu can be F1-F12 or a single keyboard letter/number.
Menu=F9

[Battle]
; Team modes use distance between team formations. Free-for-all modes use this as the scatter radius.
FirearmSpawnDistance=26
MeleeSpawnDistance=12
UnarmedSpawnDistance=8
; Battle clears when the player moves this far away from the battle centre.
CleanupDistance=360
; Global movement multiplier layered over each difficulty/boss/special MoveRate.
CombatMoveSpeedMultiplier=1.08
; Maximum count for normal ped sets. Bosses and Specials are always capped at 1.
MaxTeamCount=20

[BattleModifiers]
; If true, player mode starts normally but switches to spectator camera after player death.
ForcePlayerSpectator=false
; If true, team modes show Set Spawn/Clear Spawn rows and use saved team spawn markers.
EnableManualTeamSpawns=false
; If true, neutral teams stay neutral until the player attacks them, then fight back.
NeutralsFriendlyUntilAttacked=false
; Maximum distance from the player/battle centre for spectator camera targets. 0 disables the limit.
SpectatorMaxTargetDistance=120
; If true, Dead Eye is disabled during active battles.
NoDeadEyeDuringBattles=false
; If true, wanted level is suppressed while battles are active.
NeverWantedDuringBattles=true
; Seconds to hold everyone in place before combat starts. 0 disables countdown.
StartCountdownSeconds=0

[Deathmatch]
; Applies only to Team Deathmatch and Free For All, not survival/battle royale modes.
DefaultKillLimit=25
; Set the active score limit to 0 in-game for endless deathmatch/free-for-all rounds.
MinKillLimit=0
MaxKillLimit=500
; NPC respawn delay in milliseconds.
NpcRespawnDelayMs=4800
; Team Deathmatch only: respawn NPCs at their first battle spawn point instead of a fresh nearby point.
RespawnTeamDeathmatchAtOriginalSpawn=false

[DeathmatchPerformance]
; Keeps long-running respawn modes stable by quickly removing old NPC entities.
ImmediateNpcCorpseCleanup=true
; How long dead NPCs stay visible in deathmatch before cleanup. Clamped 0-5000ms.
CorpseVisibleMs=4000
; Keep this low for stability in large deathmatches.
MaximumRespawnsPerFrame=1
MinimumRespawnGapMs=50
; Shared FFA target snapshot refresh interval in ms.
SnapshotRefreshMs=200
; Maximum ordinary full retarget scans per frame in deathmatch.
MaximumFullRetargetsPerFrame=10
; Large-deathmatch thresholds slow only non-critical maintenance.
LargeDeathmatchThreshold=50
LargeDeathmatchCombatUpdateMs=160
LargeDeathmatchBlipValidationMs=1800
LargeDeathmatchDynamicRepairMs=25000
; Solo FFA has cheaper idle checks because there are no same-team blockers.
SoloFfaIdleCheckMs=2800
SoloFfaIdleThresholdMs=5000
; Deletes only safely tracked dropped weapon objects, never radius-cleans world/player weapons.
PreventPersistentDroppedWeapons=true

[Performance]
; Immersive corpse cleanup for non-respawn modes. Deathmatch uses DeathmatchPerformance instead.
EnableCorpseCleanup=true
NormalCorpseLifetimeMs=30000
EliteCorpseLifetimeMs=45000
MaximumCorpseLifetimeMs=90000
CorpseCleanupCheckMs=2000
CorpseCleanupMinPlayerDistance=35
PreferredMaximumCorpses=40
HardMaximumCorpses=65
; Tracks and removes weapon objects owned by battle NPCs when safe.
CleanTrackedDroppedWeapons=true
; If opposing battle NPCs are too far from the player/camera to stream properly, resolve occasional offscreen-only kills.
EnableDistantBattleSimulation=true
; Distance at which offscreen combat pockets start being simulated instead of relying on unloaded AI.
; Survival finales use a higher internal distance so the last fighters can still converge naturally when possible.
DistantBattleSimulationDistance=180
; How long the fight must remain fully distant before the first simulated casualty.
DistantBattleSimulationDelayMs=2500
; Base pacing between simulated offscreen casualties; big fights run faster and late-game fights slow down.
DistantBattleSimulationTickMs=2600

[Protection]
; Bosses/Extreme can be executed only below these health thresholds.
BossExecutionHealthThreshold=60
ExtremeExecutionHealthThreshold=120
; Damage applied when a protected cinematic kill is blocked.
BlockedExecutionDamage=35

[BossCombat]
; Bosses below this health prefer more defensive behaviour.
DefensiveHealthThreshold=100
; How long player Dead Eye is blocked after certain boss dodges.
DodgeDeadEyeSuppressMs=750

[BossHealing]
; Bosses heal only after avoiding recent damage for the relevant delay.
GunDelayMs=12000
MeleeDelayMs=14000
GunTickMs=5500
MeleeTickMs=7000
HealAmount=1

[Healing]
; Regular healing applies only to difficulties/characters with Heals=true.
RegularDelayMs=3500
RegularTickMs=900
RegularMinAmount=6

[CombatRecovery]
; Idle watchdog gently retasks NPCs that get stuck aiming/standing around.
EnableIdleWatchdog=true
OrdinaryCheckIntervalMs=1800
OrdinaryIdleThresholdMs=4000
OrdinaryConsecutiveChecks=2
SoftRecoveryDelayMs=1200
HardRecoveryCooldownMs=5000
RepositionMinDistance=3
RepositionMaxDistance=6
AllowForcedTargetChange=true

; Difficulty fields:
; Health = spawned NPC health.
; Accuracy = random value between MinAccuracy and MaxAccuracy.
; ShootRate = native ped shoot rate; higher tends to fire faster.
; MoveRate = movement speed multiplier before global CombatMoveSpeedMultiplier.
; CombatAbility: 0 poor, 1 average, 2 professional.
; CombatMovement: 0 stationary, 1 defensive, 2 will advance, 3 offensive.
; CombatRange: 0 near, 1 medium, 2 far, 3 very far.
; Hardened protects against ragdoll/one-shot style kills where supported.
; Heals enables the regular healing settings above.
; Approach/Retask/ShootBurst delays are milliseconds; lower is more active.

