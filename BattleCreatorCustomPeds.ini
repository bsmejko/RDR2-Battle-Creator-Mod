[CustomPedSets]
; Add extra normal selectable ped groups to the bottom of the Ped set list.
; This file is for normal ped groups only. Bosses and Specials need code support.
;
; How to add a set:
; 1. Increase Count.
; 2. Add matching [CustomPedSet.X] sections.
; 3. Use R in the in-game menu, or restart the game/script, to reload.
;
; Limits:
; - Up to 64 custom sets.
; - Up to 6 Models per set.
; - Up to 3 Firearms per set.
; - Up to 3 MeleeWeapons per set.
; - Separate entries with commas and no quotes.
; - If Firearms or MeleeWeapons are omitted, safe defaults are used.
Count=0

; Example:
; [CustomPedSet.1]
; Name=Example Townsfolk
; Models=A_M_M_VALTOWNFOLK_01,A_M_M_RHDROUGHTRAVELLERS_01
; Firearms=WEAPON_REVOLVER_CATTLEMAN,WEAPON_REPEATER_CARBINE,WEAPON_RIFLE_BOLTACTION
; MeleeWeapons=WEAPON_MELEE_KNIFE,WEAPON_MELEE_HATCHET,WEAPON_MELEE_MACHETE

; [CustomPedSet.2]
; Name=Example Guards
; Models=S_M_M_AMBIENTLAWRURAL_01,S_M_M_DISPATCHLEADERPOLICE_01
; Firearms=WEAPON_REPEATER_CARBINE,WEAPON_REVOLVER_CATTLEMAN
; MeleeWeapons=WEAPON_MELEE_KNIFE
